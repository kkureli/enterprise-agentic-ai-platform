name: Backend CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_ai_test"
    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_ai_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d agentic_ai_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: Run tests
        run: uv run pytest -q

  backend-image:
    name: Backend Docker image (build only)
    runs-on: ubuntu-latest
    # Skip when only frontend/docs change; rebuild when packaging/runtime inputs change.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect packaging-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - 'backend/Dockerfile'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'backend/app/**'
              - 'backend/alembic/**'
              - 'backend/alembic.ini'
              - 'backend/scripts/**'
              - 'mcp/**'
              - '.dockerignore'
              - '.github/workflows/backend-ci.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.packaging == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        if: steps.filter.outputs.packaging == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: enterprise-agentic-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
