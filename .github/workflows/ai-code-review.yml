# Uses https://github.com/kkureli/ai-code-review-agent
# Requires repository secret: OPENAI_API_KEY
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: kkureli/ai-code-review-agent@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5-mini
          min-confidence: "0.80"
          min-severity: medium
          max-comments: "8"
