[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaan Küreli", email = "kkureli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "greenlet>=3.5.5",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mcp>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.17.0",
    # Explicit so Linux production resolves from the PyTorch CPU index.
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

# Linux/Windows production images use CPU-only PyTorch wheels (no CUDA/NVIDIA).
# macOS continues to use the default PyPI torch wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/core/readiness.py" = ["BLE001"]
"app/services/redis_service.py" = ["BLE001"]
"app/services/rag_cache_service.py" = ["BLE001"]
"app/services/rate_limit_service.py" = ["BLE001"]
"app/services/sql_agent_service.py" = ["BLE001"]
"scripts/**/*.py" = ["BLE001"]
